<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client — Prosperity CRM</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app-root"></div>
<script src="../config.js"></script>
<script src="shell.js"></script>
<script>
async function render() {
  CrmApp.mount({ active: 'clients', title: 'Client Record', showCompanyFilter: false });
  const content = document.getElementById('page-content');
  const params = new URLSearchParams(location.search);
  const contactId = params.get('id');

  if (!contactId) {
    content.innerHTML = '<div class="empty-state">No client selected.</div>';
    return;
  }

  let detail;
  try {
    detail = await CrmApp.fetchJSON(`/api/app/clients/${contactId}`);
  } catch (e) {
    content.innerHTML = `<div class="empty-state">Could not load this client: ${CrmApp.escapeHtml(e.message)}</div>`;
    return;
  }

  const c = detail.contact;
  const primaryBrand = detail.contactBrands[0] || null;
  const allCases = detail.contactBrands.flatMap(cb => cb.cases.map(cs => ({ ...cs, brandId: cb.brandId, brandShortName: cb.brandShortName })));
  const activeCases = allCases.filter(cs => cs.status !== 'Archived');
  const soonestTask = [...detail.tasks].filter(t => t.status === 'Pending').sort((a, b) => (a.due_date || '').localeCompare(b.due_date || ''))[0];

  // Existing Client Reconnection outreach (Revenue MVP) -- primarily
  // initiated from the Contacts page now (crm/public/app/clients.html);
  // this card is kept here too as an optional single-client convenience.
  // Only ever shown for a contact explicitly classified as Existing Client
  // -- either relationship_type === 'active_client' (crm/lib/clientService.js)
  // or lead_type === 'Existing Client' (crm/lib/leadNormalize.js), the
  // SAME two signals crm/lib/existingClientOutreach.js's isExistingClient
  // checks -- under an ACTIVE Prosperity relationship. Never shown for a
  // Lead/Prospect or an Insurance Lady client.
  const isProsperityExistingClient = (c.relationshipType === 'active_client' || c.leadType === 'Existing Client')
    && detail.contactBrands.some(cb => cb.brandId === 'prosperity' && cb.status === 'Active');
  let reconnectionTemplates = null;
  if (isProsperityExistingClient) {
    try { reconnectionTemplates = await CrmApp.fetchJSON('/api/app/existing-client-outreach/templates'); }
    catch { reconnectionTemplates = null; }
  }

  const TABS = [
    { key: 'overview', label: 'Overview' },
    { key: 'contact', label: 'Contact Information' },
    { key: 'cases', label: 'Cases and Policies' },
    { key: 'planning', label: 'Retirement & Annuity Planning' },
    { key: 'tasks', label: 'Tasks and Next Action' },
    { key: 'appointments', label: 'Appointments' },
    { key: 'texts', label: 'Texts' },
    { key: 'calls', label: 'Call Log' },
    { key: 'communications', label: 'Communications' },
    { key: 'notes', label: 'Notes' },
    { key: 'documents', label: 'Documents' },
    { key: 'marketing', label: 'Marketing and Original Source' },
    { key: 'audit', label: 'Audit History' },
  ];

  function companyBadges() {
    return detail.contactBrands.map(cb => CrmApp.companyBadge(cb.brandId, cb.brandShortName)).join(' ') || '<span class="text-faint">No company assignment yet</span>';
  }

  async function reloadPage() { location.reload(); }

  // Relationship/client type options mirror crm/lib/clientService.js's own
  // RELATIONSHIP_TYPES exactly (that module is the source of truth; this is
  // just a matching label list for the <select>, same pattern the Add
  // Contact UIs already use). Lead status is a much looser, long-lived free
  // -text field (legacy dashboard, crm/public/app.js's PIPELINE_STATUSES) --
  // offered as a dropdown of the known values, but the contact's OWN current
  // value is always included even if it isn't one of them, so saving never
  // silently rewrites an unrecognized existing status.
  const RELATIONSHIP_TYPE_OPTIONS = [
    { value: '', label: '(not set)' },
    { value: 'lead', label: 'Lead' },
    { value: 'active_client', label: 'Active Client' },
    { value: 'former_client', label: 'Former Client' },
    { value: 'prior_applicant', label: 'Prior Applicant' },
    { value: 'declined_applicant', label: 'Declined Applicant' },
  ];
  const KNOWN_LEAD_STATUSES = [
    'New Lead', 'Contacted', 'Appointment Scheduled', 'Appointment Completed',
    'Follow-Up Needed', 'Illustration Sent', 'Application Submitted',
    'Underwriting', 'Client', 'Sold', 'Long-Term Nurture',
  ];

  function editClientModal() {
    const esc = CrmApp.escapeHtml;
    const field = (label, name, value, opts = {}) => `
      <div class="form-field${opts.full ? ' full' : ''}"><label>${label}</label>
        <input class="input" name="${name}" ${opts.type ? `type="${opts.type}"` : ''} ${opts.attrs || ''} value="${esc(value || '')}">
      </div>`;
    const textarea = (label, name, value, rows) => `
      <div class="form-field full"><label>${label}</label><textarea class="input" name="${name}" rows="${rows || 3}">${esc(value || '')}</textarea></div>`;

    const currentLeadStatus = c.leadStatus || 'New Lead';
    const leadStatusOptions = KNOWN_LEAD_STATUSES.includes(currentLeadStatus)
      ? KNOWN_LEAD_STATUSES : [currentLeadStatus, ...KNOWN_LEAD_STATUSES];

    const dialog = CrmApp.openModal({
      title: 'Edit Client',
      wide: true,
      bodyHtml: `
        <form id="edit-client-form">
          <div class="form-section-title">Identity &amp; Contact</div>
          <div class="form-grid">
            ${field('First name', 'firstName', c.firstName)}
            ${field('Last name', 'lastName', c.lastName)}
            ${field('Middle name', 'middleName', c.middleName)}
            ${field('Mobile phone', 'phone', c.phone, { type: 'tel' })}
            ${field('Home phone', 'homePhone', c.homePhone, { type: 'tel' })}
            ${field('Alternate phone', 'altPhone', c.altPhone, { type: 'tel' })}
            ${field('Email', 'email', c.email, { type: 'email' })}
            ${field('Preferred contact method', 'preferredContactMethod', c.preferredContactMethod)}
            ${field('Best time to contact', 'bestTimeToContact', c.bestTimeToContact)}
          </div>

          <div class="form-section-title">Address</div>
          <div class="form-grid">
            ${field('Street address', 'address', c.address, { full: true })}
            ${field('City', 'city', c.city)}
            ${field('State', 'state', c.state, { attrs: 'maxlength="2"' })}
            ${field('ZIP code', 'zip', c.zip)}
          </div>

          <div class="form-section-title">Personal</div>
          <div class="form-grid">
            ${field('Date of birth', 'dateOfBirth', c.dateOfBirth, { type: 'date' })}
            ${field('Age', 'age', c.age, { type: 'number', attrs: 'min="0"' })}
            ${field('Marital status', 'maritalStatus', c.maritalStatus)}
            ${field('Occupation', 'occupation', c.occupation)}
            ${field('Employer', 'employer', c.employer)}
            ${field('Spouse name', 'spouseName', c.spouseName)}
            ${field('Spouse date of birth', 'spouseDateOfBirth', c.spouseDateOfBirth, { type: 'date' })}
            ${field('Number of children', 'numberOfChildren', c.numberOfChildren, { type: 'number', attrs: 'min="0"' })}
            ${field('Number of grandchildren', 'numberOfGrandchildren', c.numberOfGrandchildren, { type: 'number', attrs: 'min="0"' })}
            ${textarea('Family notes', 'familyNotes', c.familyNotes)}
          </div>

          <div class="form-section-title">Classification</div>
          <div class="form-grid">
            ${field('Original source', 'originalSource', c.originalSource)}
            ${field('Referred by', 'referredBy', c.referredBy)}
            <div class="form-field"><label>Lead status</label>
              <select class="input" name="leadStatus">
                ${leadStatusOptions.map(s => `<option value="${esc(s)}" ${s === currentLeadStatus ? 'selected' : ''}>${esc(s)}</option>`).join('')}
              </select>
            </div>
            <div class="form-field"><label>Relationship / client type</label>
              <select class="input" name="relationshipType">
                ${RELATIONSHIP_TYPE_OPTIONS.map(o => `<option value="${o.value}" ${o.value === (c.relationshipType || '') ? 'selected' : ''}>${o.label}</option>`).join('')}
              </select>
            </div>
          </div>

          <div class="form-section-title">Consent</div>
          <div class="form-grid">
            <div class="form-field full"><label style="display:flex; align-items:center; gap:8px; font-weight:400;"><input type="checkbox" name="smsConsent" id="edit-client-sms-consent" style="width:auto;" ${c.smsConsent ? 'checked' : ''}> SMS consent on file <span class="hint">(required before this client can be texted from the CRM)</span></label></div>
            <div class="form-field full"><label style="display:flex; align-items:center; gap:8px; font-weight:400;"><input type="checkbox" name="emailConsent" id="edit-client-email-consent" style="width:auto;" ${c.emailConsent ? 'checked' : ''}> Email consent on file</label></div>
            <div class="form-field full text-faint" style="line-height:1.7;">
              Consent method: ${esc(c.smsConsentSource || '—')}<br>
              Consent date: ${c.smsConsentAt ? esc(new Date(c.smsConsentAt).toLocaleString()) : '—'}<br>
              Consent brand: ${primaryBrand ? esc(primaryBrand.brandShortName) : '—'}
              ${c.smsOptedOutAt ? `<br><span class="text-danger">Opted out (STOP) at ${esc(new Date(c.smsOptedOutAt).toLocaleString())}</span>` : ''}
            </div>
            ${textarea('Consent notes', 'smsConsentNotes', c.smsConsentNotes)}
          </div>

          <div class="form-section-title">Notes</div>
          <div class="form-grid">
            ${textarea('General notes', 'generalNotes', c.generalNotes, 4)}
          </div>

          <div class="text-faint" style="margin-top:16px; padding-top:14px; border-top:1px solid var(--border);">Permanent company (${primaryBrand ? esc(primaryBrand.brandShortName) : 'none'}) cannot be edited here — use "Request Company Change" instead.</div>
          <div class="form-error" id="edit-client-error"></div>
          <div class="crmapp-modal-actions">
            <button type="button" class="btn" id="edit-client-cancel">Cancel</button>
            <button type="submit" class="btn primary">Save Changes</button>
          </div>
        </form>
      `,
    });
    dialog.querySelector('#edit-client-cancel').addEventListener('click', () => dialog.close());
    dialog.querySelector('#edit-client-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fields = Object.fromEntries(new FormData(e.target).entries());
      // Read both consent checkboxes directly rather than trusting
      // FormData, which omits an unchecked box entirely -- this keeps
      // smsConsent/emailConsent explicit true/false every time, so
      // unchecking one actually revokes it instead of silently leaving the
      // old value in place. Consent METHOD/DATE/BRAND are never sent from
      // here at all (no input carries those names) -- the server-side
      // audit trail (crm/lib/clientService.js) is only ever touched by the
      // consent checkbox transitioning off->on, and only re-stamps its own
      // timestamp when that happens; it is never client-supplied.
      fields.smsConsent = dialog.querySelector('#edit-client-sms-consent').checked;
      fields.emailConsent = dialog.querySelector('#edit-client-email-consent').checked;
      try {
        await CrmApp.postJSON(`/api/app/clients/${contactId}`, 'PATCH', fields);
        CrmApp.toast('Client updated.');
        dialog.close();
        reloadPage();
      } catch (err) {
        dialog.querySelector('#edit-client-error').textContent = err.message;
      }
    });
  }

  function requestCompanyChangeModal() {
    const otherBrand = primaryBrand && primaryBrand.brandId === 'prosperity' ? 'insurance-lady' : 'prosperity';
    const otherLabel = otherBrand === 'insurance-lady' ? 'Insurance Lady' : 'Prosperity';
    const dialog = CrmApp.openModal({
      title: 'Request Company Change',
      bodyHtml: `
        <p style="font-size:13.5px;">This does not move the client. It stages a request in Review Required, which preserves both the current and requested company and requires a deliberate, separate decision.</p>
        <form id="company-change-form">
          <div class="form-field full"><label>Requested company</label>
            <select class="input" name="requestedBrandSlug">
              <option value="${otherBrand}">${otherLabel}</option>
            </select>
          </div>
          <div class="form-field full" style="margin-top:10px;"><label>Reason</label><textarea class="input" name="reason" placeholder="Why is this change needed?"></textarea></div>
          <div class="form-error" id="company-change-error"></div>
          <div class="crmapp-modal-actions">
            <button type="button" class="btn" id="company-change-cancel">Cancel</button>
            <button type="submit" class="btn primary">Stage for Review</button>
          </div>
        </form>
      `,
    });
    dialog.querySelector('#company-change-cancel').addEventListener('click', () => dialog.close());
    dialog.querySelector('#company-change-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fields = Object.fromEntries(new FormData(e.target).entries());
      try {
        await CrmApp.postJSON(`/api/app/clients/${contactId}/request-company-change`, 'POST', fields);
        CrmApp.toast('Company change staged in Review Required.');
        dialog.close();
      } catch (err) {
        dialog.querySelector('#company-change-error').textContent = err.message;
      }
    });
  }

  async function toggleArchiveClient() {
    const archiving = !c.archivedAt;
    const ok = await CrmApp.confirmAction(
      archiving
        ? `Archive ${CrmApp.escapeHtml(c.name)}? Cases, policies, notes, and history are all preserved and this can be undone.`
        : `Restore ${CrmApp.escapeHtml(c.name)}?`,
      { confirmLabel: archiving ? 'Archive' : 'Restore', danger: archiving }
    );
    if (!ok) return;
    await CrmApp.postJSON(`/api/app/clients/${contactId}/${archiving ? 'archive' : 'restore'}`, 'POST');
    CrmApp.toast(archiving ? 'Client archived.' : 'Client restored.');
    reloadPage();
  }

  function overviewHtml() {
    return `
      <div class="grid grid-3">
        <div class="card"><div class="card-body">
          <div class="text-faint">PERMANENT COMPANY</div>
          <div style="margin-top:6px;">${companyBadges()}</div>
        </div></div>
        <div class="card"><div class="card-body">
          <div class="text-faint">ACTIVE CASES</div>
          <div style="font-size:22px;font-weight:800;margin-top:4px;">${activeCases.length}</div>
        </div></div>
        <div class="card"><div class="card-body">
          <div class="text-faint">NEXT ACTION</div>
          <div style="margin-top:4px; font-weight:600;">${soonestTask ? CrmApp.escapeHtml(soonestTask.notes || soonestTask.task_type) : 'None scheduled'}</div>
          ${soonestTask ? `<div class="text-faint">${CrmApp.friendlyDate(soonestTask.due_date)}</div>` : ''}
        </div></div>
      </div>
      <div class="card" style="margin-top:16px;">
        <div class="card-header"><h2>Snapshot</h2></div>
        <div class="card-body">
          <dl class="kv-list">
            <dt>Phone</dt><dd>${CrmApp.escapeHtml(c.phone || '—')}</dd>
            <dt>Email</dt><dd>${CrmApp.escapeHtml(c.email || '—')}</dd>
            <dt>Location</dt><dd>${CrmApp.escapeHtml([c.city, c.state].filter(Boolean).join(', ') || '—')}</dd>
            <dt>Cases</dt><dd>${allCases.map(cs => `${CrmApp.escapeHtml(cs.productName || cs.title || 'Case')} — <span class="pill status-${cs.status.toLowerCase()}">${cs.status}</span>`).join('<br>') || '—'}</dd>
          </dl>
        </div>
      </div>`;
  }

  const RELATIONSHIP_TYPE_LABELS = {
    lead: 'Lead / Prospect', active_client: 'Existing Client', former_client: 'Former Client',
    prior_applicant: 'Prior Applicant', declined_applicant: 'Declined Applicant',
  };

  function contactInfoHtml() {
    // Consent Brand isn't its own stored field (crm/lib/existingClientOutreach.js's
    // header comment) -- shown here as the contact's current active company,
    // the same relationship the consent itself was given under.
    const consentBrandLabel = primaryBrand ? primaryBrand.brandShortName === 'Prosperity' ? 'Prosperity Life & Financial Solutions' : primaryBrand.brandShortName : '—';
    return `<div class="card"><div class="card-body">
      <dl class="kv-list">
        <dt>First name</dt><dd>${CrmApp.escapeHtml(c.firstName || '—')}</dd>
        <dt>Last name</dt><dd>${CrmApp.escapeHtml(c.lastName || '—')}</dd>
        <dt>Phone</dt><dd>${CrmApp.escapeHtml(c.phone || '—')}</dd>
        <dt>Email</dt><dd>${CrmApp.escapeHtml(c.email || '—')}</dd>
        <dt>Address</dt><dd>${CrmApp.escapeHtml(c.address || '—')}</dd>
        <dt>City</dt><dd>${CrmApp.escapeHtml(c.city || '—')}</dd>
        <dt>State</dt><dd>${CrmApp.escapeHtml(c.state || '—')}</dd>
        <dt>ZIP code</dt><dd>${CrmApp.escapeHtml(c.zip || '—')}</dd>
        <dt>Date of birth</dt><dd>${CrmApp.escapeHtml(c.dateOfBirth || '—')}</dd>
        <dt>Original source</dt><dd>${CrmApp.escapeHtml(c.originalSource || '—')}</dd>
        <dt>Relationship</dt><dd>${CrmApp.escapeHtml(RELATIONSHIP_TYPE_LABELS[c.relationshipType] || '—')}</dd>
        <dt>SMS Consent</dt><dd>${c.smsConsent ? 'YES' : (c.smsOptedOutAt ? 'STOPPED (opted out)' : 'NO')}</dd>
        <dt>Consent Date</dt><dd>${c.smsConsentAt ? CrmApp.friendlyDateTime(c.smsConsentAt) : '—'}</dd>
        <dt>Consent Method</dt><dd>${CrmApp.escapeHtml(c.smsConsentSource || '—')}</dd>
        <dt>Consent Brand</dt><dd>${c.smsConsent && c.smsConsentSource ? CrmApp.escapeHtml(consentBrandLabel) : '—'}</dd>
        <dt>Email Consent</dt><dd>${c.emailConsent ? 'Yes' : 'No'}</dd>
        <dt>Lead Status</dt><dd>${CrmApp.escapeHtml(c.leadStatus || '—')}</dd>
        <dt>General notes</dt><dd style="white-space:pre-wrap;">${CrmApp.escapeHtml(c.generalNotes || '—')}</dd>
      </dl>
    </div></div>`;
  }

  // Read-only legacy insurance data (crm/lib/dashboardQueries.js's
  // legacyInsurance/legacyAnnuity) -- pre-dates the Policies module, never
  // written by any current code path, but shown here (never on Retirement &
  // Annuity Planning) so it stays co-located with where this information
  // now actually belongs. Renders nothing at all once every legacy field is
  // null, which is the normal case for any contact created after Policies
  // existed. See crm/lib/clientService.js's applyContactFields comment for
  // the full field-by-field mapping to the new Policy record.
  function legacyInsuranceBannerHtml() {
    const li = c.legacyInsurance || {};
    const la = c.legacyAnnuity || {};
    const rows = [
      ['Insurance company', li.insuranceCompany],
      ['Policy type', li.policyType],
      ['Face amount', li.faceAmount != null ? '$' + Number(li.faceAmount).toLocaleString() : null],
      ['Monthly premium', li.monthlyPremium != null ? '$' + Number(li.monthlyPremium).toLocaleString() : null],
      ['Annual premium', li.annualPremium != null ? '$' + Number(li.annualPremium).toLocaleString() : null],
      ['Policy status', li.policyStatus],
      ['Application date', li.applicationDate],
      ['Policy issue date', li.policyIssueDate],
      ['Annuity carrier', la.annuityCarrier],
      ['Annuity premium', la.annuityPremium != null ? '$' + Number(la.annuityPremium).toLocaleString() : null],
    ].filter(([, v]) => v != null && v !== '');
    if (!rows.length) return '';
    return `<div class="card" style="margin-bottom:14px; border-color: var(--border-strong);">
      <div class="card-body">
        <div style="font-weight:700; font-size:13.5px;">Legacy insurance/annuity data (pre-Policies)</div>
        <div class="text-faint" style="margin-top:4px;">Carried over from before the Cases/Policies module existed — never updated by any current workflow. Add or edit a real Policy below to make this information current.</div>
        <dl class="kv-list" style="margin-top:10px;">
          ${rows.map(([label, val]) => `<dt>${CrmApp.escapeHtml(label)}</dt><dd>${CrmApp.escapeHtml(String(val))}</dd>`).join('')}
        </dl>
      </div>
    </div>`;
  }

  function casesHtml() {
    const legacyBanner = legacyInsuranceBannerHtml();
    if (!detail.contactBrands.length) return legacyBanner + '<div class="empty-state">No company relationship established yet.</div>';
    return legacyBanner + detail.contactBrands.map(cb => `
      <div class="card" style="margin-bottom:14px;">
        <div class="card-header">
          <h2>${CrmApp.companyBadge(cb.brandId, cb.brandShortName)}</h2>
          <button class="btn small primary" data-new-case="${cb.brandId}">New Case</button>
        </div>
        <div class="card-body no-pad">
          ${cb.cases.length ? cb.cases.map(cs => `
            <div style="padding:14px 18px; border-bottom:1px solid var(--border);">
              <div style="display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:center;">
                <strong>${CrmApp.escapeHtml(cs.productName || cs.title || ('Case #' + cs.caseId))}</strong>
                <span style="display:flex; gap:8px; align-items:center;">
                  <span class="pill status-${cs.status.toLowerCase()}">${cs.status}</span>
                  <button class="btn small ghost" data-edit-case="${cs.caseId}" data-status="${cs.status}" data-title="${CrmApp.escapeHtml(cs.productName || cs.title || '')}">Edit</button>
                  <button class="btn small ghost" data-toggle-case="${cs.caseId}" data-status="${cs.status}">${cs.status === 'Archived' ? 'Restore' : 'Archive'}</button>
                </span>
              </div>
              <div class="text-faint" style="margin-top:4px;">Opened ${CrmApp.friendlyDate(cs.openedAt)} · Last activity ${CrmApp.friendlyDate(cs.lastActivity)}</div>
              ${cs.nextAction ? `<div style="margin-top:6px; font-size:13px;">Next: ${CrmApp.escapeHtml(cs.nextAction.notes || cs.nextAction.taskType)} — ${CrmApp.friendlyDate(cs.nextAction.dueDate)}</div>` : ''}
              ${cs.policies.length ? `
                <div class="table-scroll" style="margin-top:10px;">
                  <table class="data-table">
                    <thead><tr><th>Carrier</th><th>Policy #</th><th>Status</th><th>Coverage</th><th>Premium</th><th>Renewal</th><th></th></tr></thead>
                    <tbody>${cs.policies.map(p => `<tr>
                      <td>${CrmApp.escapeHtml(p.carrier || '—')}</td>
                      <td>${CrmApp.escapeHtml(p.policy_number || '—')}</td>
                      <td><span class="pill status-${(p.policy_status || '').toLowerCase()}">${CrmApp.escapeHtml(p.policy_status || '—')}</span></td>
                      <td>${p.coverage_amount ? '$' + Number(p.coverage_amount).toLocaleString() : '—'}</td>
                      <td>${p.premium ? '$' + Number(p.premium).toLocaleString() : '—'}</td>
                      <td>${CrmApp.escapeHtml(p.renewal_date || '—')}</td>
                      <td><button class="btn small ghost" data-edit-policy="${p.id}" data-case-id="${cs.caseId}">Edit</button></td>
                    </tr>`).join('')}</tbody>
                  </table>
                </div>` : '<div class="text-faint" style="margin-top:8px;">No policy on file yet.</div>'}
              <div style="margin-top:10px;"><button class="btn small ghost" data-add-policy="${cs.caseId}">Add Policy</button></div>
            </div>`).join('') : '<div class="empty-state">No cases yet.</div>'}
        </div>
      </div>`).join('');
  }

  const PRODUCTS_BY_BRAND = {
    'insurance-lady': ['Online life-insurance application', 'Cash-building life insurance', 'Whole life/final expense', 'Cash cancer insurance', 'Annuities and safe-money solutions', 'Follow-up/service'],
    prosperity: ['Life insurance', 'Annuities', 'Rollovers and safe-money solutions', 'Follow-up/service'],
  };

  function newCaseModal(brandId) {
    const dialog = CrmApp.openModal({
      title: 'New Case',
      bodyHtml: `
        <form id="new-case-form">
          <div class="form-field full"><label>Product / Service</label>
            <select class="input" name="productName">${PRODUCTS_BY_BRAND[brandId].map(p => `<option>${p}</option>`).join('')}</select>
          </div>
          <div class="form-field full" style="margin-top:10px;"><label>Title (optional)</label><input class="input" name="title"></div>
          <div class="form-error" id="new-case-error"></div>
          <div class="crmapp-modal-actions">

  // Attaches business outcome/notes/related case/follow-up to a call the
  // CRM already placed and auto-logged (direction, contact, brand, start
  // time, and Twilio Call SID were all captured automatically when the
  // call was initiated, and Twilio's own status webhooks kept it updated
  // as the call progressed) — never creates a second call record. Uses the
  // SAME dynamic list of this client's actual open cases as the manual
  // Log Call form below, never a hard-coded product list.
  function callOutcomeModal(call) {
    const CALL_OUTCOMES = ['No answer', 'Left voicemail', 'Spoke with client', 'Appointment scheduled', 'Follow-up needed', 'Not interested', 'Wrong number'];
    const caseOptions = activeCases.map(cs => `<option value="${cs.caseId}" ${call.case_id === cs.caseId ? 'selected' : ''}>${CrmApp.escapeHtml(cs.productName || cs.title || ('Case #' + cs.caseId))}</option>`).join('');
    // The call row itself has no follow-up columns -- due_date/due_time/
    // notes live on the linked follow_up_tasks row (call.follow_up_task_id).
    // detail.tasks already holds every task for this client regardless of
    // status, so a completed task is still found here -- editing an
    // outcome after its task is completed still shows what was originally
    // asked for, never blank.
    const linkedTask = call.follow_up_task_id ? (detail.tasks || []).find(t => t.id === call.follow_up_task_id) : null;
    const dialog = CrmApp.openModal({
      title: 'Call Outcome', wide: true,
      bodyHtml: `
        <dl class="kv-list" style="margin-bottom:14px;">
          <dt>Direction</dt><dd style="text-transform:capitalize;">${CrmApp.escapeHtml(call.direction || '—')}</dd>
          <dt>Started</dt><dd>${CrmApp.friendlyDateTime(call.started_at || call.created_at)}</dd>
          <dt>Status</dt><dd>${CrmApp.escapeHtml(call.status || '—')}</dd>
          <dt>Duration</dt><dd>${call.duration_sec ? Math.round(call.duration_sec / 60) + ' min' : '—'}</dd>
        </dl>
        <form id="call-outcome-form">
          <div class="form-grid">
            <div class="form-field"><label>Outcome</label>
              <select class="input" name="outcome" required>${CALL_OUTCOMES.map(o => `<option ${call.outcome === o ? 'selected' : ''}>${o}</option>`).join('')}</select>
            </div>
            ${caseOptions ? `<div class="form-field"><label>Related case</label><select class="input" name="caseId"><option value="">None</option>${caseOptions}</select></div>` : ''}
            <div class="form-field full"><label>Summary</label><input class="input" name="summary" value="${CrmApp.escapeHtml(call.summary || '')}" placeholder="Short summary"></div>
            <div class="form-field full"><label>Detailed notes</label><textarea class="input" name="detailedNotes">${CrmApp.escapeHtml(call.notes || '')}</textarea></div>
            <div class="form-field"><label>Next follow-up date</label><input class="input" name="nextActionDueDate" type="date" value="${CrmApp.escapeHtml(linkedTask ? linkedTask.due_date || '' : '')}"></div>
            <div class="form-field"><label>Next follow-up time</label><input class="input" name="nextActionDueTime" type="time" value="${CrmApp.escapeHtml(linkedTask ? linkedTask.due_time || '' : '')}"></div>
            <div class="form-field full"><label>Follow-up task</label><input class="input" name="nextAction" placeholder="What needs to happen next?" value="${CrmApp.escapeHtml(linkedTask ? linkedTask.notes || '' : '')}"></div>
            ${linkedTask ? `<div class="form-field full text-faint">Linked task status: ${CrmApp.escapeHtml(linkedTask.status)}${linkedTask.status === 'Completed' ? ' — editing these fields updates the historical record; it does not reopen the task.' : ''}</div>` : ''}
          </div>
          <div class="form-error" id="call-outcome-error"></div>
          <div class="crmapp-modal-actions">
            <button type="button" class="btn" id="call-outcome-cancel">Cancel</button>
            <button type="submit" class="btn primary">Save Outcome</button>
          </div>
        </form>
      `,
    });
    dialog.querySelector('#call-outcome-cancel').addEventListener('click', () => dialog.close());
    dialog.querySelector('#call-outcome-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fields = Object.fromEntries(new FormData(e.target).entries());
      if (fields.caseId) fields.caseId = Number(fields.caseId);
      try {
        const result = await CrmApp.postJSON(`/api/app/calls/${call.id}`, 'PATCH', fields);
        const message = !result.followUpTask ? 'Outcome saved.'
          : linkedTask ? 'Outcome saved and follow-up task updated.'

        CrmApp.toast(message);
        dialog.close();
        reloadPage();
      } catch (err) {
        dialog.querySelector('#call-outcome-error').textContent = err.message;
      }
    });

  // registries -- adding a future template (Birthday, Follow-Up, etc.)
  // there needs no button/modal changes here at all, it just appears as
  // another <option>. Selecting a template and previewing it is entirely
  // client-side (no network call, so nothing here can be blocked by the
  // send-consent gate) -- only clicking "Send" below ever calls the
  // backend, which is the one place that gate legitimately applies. This

  // outreach never routes through those.
  function reconnectionModal(channel) {
    if (!reconnectionTemplates) { CrmApp.toast('Could not load the message template.', { error: true }); return; }
    const isSms = channel === 'sms';
    const officePhone = reconnectionTemplates.officePhone;
    const templateList = isSms ? reconnectionTemplates.smsTemplates : reconnectionTemplates.emailTemplates;
    if (!templateList.length) { CrmApp.toast('No message templates are configured for this channel.', { error: true }); return; }
    let templateKey = templateList[0].templateKey;

    function currentTemplate() {
      return templateList.find(t => t.templateKey === templateKey);
    }
    function substituted(rawText) {
      return String(rawText || '')
        .replace(/\{\{first_name\}\}/g, c.firstName || 'there')
        .replace(/\{\{office_phone\}\}/g, officePhone)
        .replace(/\{\{booking_link\}\}/g, reconnectionTemplates.bookingLink);
    }

    const dialog = CrmApp.openModal({
      title: isSms ? 'Send Text' : 'Send Email',
      wide: true,
      bodyHtml: `
        <div style="display:flex; gap:8px; align-items:center; margin-bottom:6px; flex-wrap:wrap;">
          ${CrmApp.companyBadge('prosperity', 'Prosperity')}
          <span class="text-faint">${isSms ? `Sending number: ${CrmApp.escapeHtml(officePhone)}` : 'Sending from: loretta@prosperitylfs.com'}</span>
        </div>
        <div class="text-faint" style="margin-bottom:10px;">To: ${CrmApp.escapeHtml(c.name)} · ${CrmApp.escapeHtml(isSms ? (c.phone || 'No phone on file') : (c.email || 'No email on file'))}</div>
        <div class="form-field full">
          <label>Template</label>
          <select class="input" id="reconnection-template">
            ${templateList.map(t => `<option value="${CrmApp.escapeHtml(t.templateKey)}">${CrmApp.escapeHtml(t.label)}</option>`).join('')}
          </select>
        </div>
        ${isSms ? '' : `<div class="form-field full" style="margin-top:8px;"><label>Subject</label><input class="input" id="reconnection-subject" value="${CrmApp.escapeHtml(substituted(currentTemplate().subject))}"></div>`}
        <div class="form-field full" style="margin-top:8px;"><label>Message</label><textarea class="input" id="reconnection-body" rows="14">${CrmApp.escapeHtml(substituted(currentTemplate().body))}</textarea></div>
        <div class="form-error" id="reconnection-error"></div>
        <div class="crmapp-modal-actions">
          <button type="button" class="btn" id="reconnection-cancel">Cancel</button>
          <button type="button" class="btn primary" id="reconnection-send">Send</button>
        </div>
      `,
    });
    dialog.querySelector('#reconnection-cancel').addEventListener('click', () => dialog.close());
    dialog.querySelector('#reconnection-template').addEventListener('change', (e) => {
      templateKey = e.target.value;
      dialog.querySelector('#reconnection-body').value = substituted(currentTemplate().body);
      if (!isSms) dialog.querySelector('#reconnection-subject').value = substituted(currentTemplate().subject);
    });

    async function attemptSend(confirmResend) {
      const errorEl = dialog.querySelector('#reconnection-error');
      errorEl.textContent = '';
      const bodyText = dialog.querySelector('#reconnection-body').value;
      try {
        const result = isSms
          ? await CrmApp.postJSON(`/api/app/clients/${contactId}/existing-client-sms`, 'POST', { message: bodyText, confirmResend, templateKey })
          : await CrmApp.postJSON(`/api/app/clients/${contactId}/existing-client-email`, 'POST', { subject: dialog.querySelector('#reconnection-subject').value, body: bodyText });

        if (result.outcome === 'sent') {
          CrmApp.toast(isSms ? 'Text sent.' : 'Email sent.');
          dialog.close();
          reloadPage();
          return;
        }
        if (isSms && result.code === 'already_sent' && !confirmResend) {
          const ok = await CrmApp.confirmAction('This contact already received this message. Send again anyway?', { confirmLabel: 'Resend' });
          if (ok) return attemptSend(true);
          return;
        }
        errorEl.textContent = result.reason || 'This message could not be sent.';
      } catch (err) {
        errorEl.textContent = err.message;
      }
    }
    dialog.querySelector('#reconnection-send').addEventListener('click', () => attemptSend(false));
  }

  // Overflow indication for the scrollable tab bar (correction #2): show

  function composeDraftModal(channel) {
    const consentOk = channel === 'text' ? c.smsConsent : channel === 'email' ? c.emailConsent : true;
    const dialog = CrmApp.openModal({
      title: channel === 'text' ? 'Draft Text' : 'Draft Email',
      bodyHtml: !consentOk ? `
        <p class="confirm-message">This client has not given ${channel === 'text' ? 'SMS' : 'email'} consent — a draft cannot be created.</p>

      ` : `

            <button type="submit" class="btn primary">Save Draft &amp; Continue</button>
          </div>
        </form>
      `,
    });
    if (!consentOk) {
      dialog.querySelector('#draft-close-noconsent').addEventListener('click', () => dialog.close());
      return;
    }
    const caseId = activeCases[0] ? activeCases[0].caseId : null;
    let senderIdentity = null;
    const brandField = dialog.querySelector('#draft-brand-field');
    const brandSelect = dialog.querySelector('#draft-brand-select');
    const previewEl = dialog.querySelector('#draft-sender-preview');

    // The business selector only applies to the no-case, manual-selection
    // path (crm/lib/senderGuardrail.js's getSenderGuardrailForManualSelection)
    // — a case already fixes its own brand and has nothing to choose here.
    // Re-fetching with an explicit manualBrand previews (never sends) as
    // that brand; omitting it lets the server default to the contact's own
    // current brand assignment (see defaultManualBrandForContact).
    async function loadSenderPreview(manualBrand) {
      const params = new URLSearchParams();
      if (caseId) params.set('caseId', caseId);
      else if (manualBrand) params.set('manualBrand', manualBrand);
      const qs = params.toString();
      const result = await CrmApp.fetchJSON(`/api/app/clients/${contactId}/sender-preview${qs ? '?' + qs : ''}`);

      if (!caseId && result.brandChoices && result.brandChoices.length) {
        if (!brandSelect.options.length) {
          brandSelect.innerHTML = result.brandChoices.map(b => `<option value="${CrmApp.escapeHtml(b.id)}">${CrmApp.escapeHtml(b.shortName)}</option>`).join('');
        }
        if (result.brandId) brandSelect.value = result.brandId;
        brandField.style.display = '';
      }

      if (result.scenario === 'no_relationship') {
        senderIdentity = null;
        previewEl.innerHTML = `<div class="sender-preview blocked">${CrmApp.escapeHtml(result.message)}</div>`;
      } else {
        const chan = result.channels[channel];
        senderIdentity = chan.identity || null;
        previewEl.innerHTML = `<div class="sender-preview${chan.blocked ? ' blocked' : ''}">${CrmApp.escapeHtml(chan.message)}</div>`;
      }
    }
    loadSenderPreview(null);
    brandSelect.addEventListener('change', () => loadSenderPreview(brandSelect.value));

    dialog.querySelector('#draft-cancel').addEventListener('click', () => dialog.close());
    dialog.querySelector('#draft-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fields = Object.fromEntries(new FormData(e.target).entries());
      fields.contactId = Number(contactId);
      fields.channel = channel;
      fields.caseId = caseId;
      try {
        const draft = await CrmApp.postJSON('/api/app/communications/draft', 'POST', fields);
        showSendConfirmation(dialog, draft, senderIdentity);
      } catch (err) {
        dialog.querySelector('#draft-error').textContent = err.message;
      }
    });
  }

  function showSendConfirmation(dialog, draft, senderLabel) {
    dialog.querySelector('.crmapp-modal-body').innerHTML = `
      <p class="confirm-message">Ready to send this ${CrmApp.escapeHtml(draft.channel)} to <strong>${CrmApp.escapeHtml(draft.to_address || 'this client')}</strong>${senderLabel ? ` from <strong>${CrmApp.escapeHtml(senderLabel)}</strong>` : ''}?</p>
      <div class="crmapp-modal-actions">
        <button type="button" class="btn" id="draft-back">Keep as Draft</button>
        <button type="button" class="btn primary" id="draft-confirm-send">Send</button>
      </div>
      <div id="draft-blocked-area"></div>
    `;
    dialog.querySelector('#draft-back').addEventListener('click', () => { CrmApp.toast('Saved as draft.'); dialog.close(); });
    dialog.querySelector('#draft-confirm-send').addEventListener('click', async () => {
      let result;
      try {
        result = await CrmApp.postJSON(`/api/app/communications/draft/${draft.id}/confirm-send`, 'POST');
      } catch (err) {
        dialog.querySelector('#draft-blocked-area').innerHTML = `<div class="blocked-notice">${CrmApp.escapeHtml(err.message)}</div>`;
        return;
      }
      // Reflects the ACTUAL provider result (real Twilio send when
      // COMMUNICATION_PROVIDER=twilio is configured server-side, or the
      // specific reason it didn't go out) instead of a hard-coded message —
      // this only ever came from the fake adapter's own returned text
      // before, which would have gone stale the moment live sending was
      // configured.
      const sent = result.providerResult && result.providerResult.status === 'sent';
      const message = result.providerResult ? result.providerResult.message : null;
      dialog.querySelector('#draft-blocked-area').innerHTML = sent
        ? `<div class="confirm-message">Sent.</div>`
        : `<div class="blocked-notice">${CrmApp.escapeHtml(message || 'This message was not sent.')}</div>`;

      if (sent) CrmApp.toast('Text sent — see the Texts tab.');

    });
  }

  // Shows the same sender-guardrail preview as before (brand + number this

  async function callPreviewModal() {

    const channelBlocked = !relationshipBlocked && guardrail.channels.call.blocked;
    const message = relationshipBlocked ? guardrail.message : guardrail.channels.call.message;
    const canCall = !relationshipBlocked && !channelBlocked;

    const dialog = CrmApp.openModal({
      title: 'Call',

        <div class="sender-preview${canCall ? '' : ' blocked'}">${CrmApp.escapeHtml(message)}</div>

    });
    dialog.querySelector('#call-close').addEventListener('click', () => dialog.close());
    const initiateBtn = dialog.querySelector('#call-initiate');
    if (initiateBtn) {

        initiateBtn.disabled = true;

          dialog.querySelector('#call-initiate-result').innerHTML = '<div class="confirm-message">Your phone is ringing — answer to connect to the client.</div>';

          initiateBtn.remove();

          dialog.querySelector('#call-initiate-result').innerHTML = `<div class="blocked-notice">${CrmApp.escapeHtml(err.message)}</div>`;

          initiateBtn.textContent = 'Call Now';

      });
    }
  }

  // Manual call logging (Prosperity Revenue MVP, Requirement 5). No audio
  // recording, no transcription — a structured note about a call that
  // already happened. Separate from the "Call" button above, which only
  // previews a (still-disabled) live-call attempt.
  function callLogModal() {
    const CALL_OUTCOMES = ['No answer', 'Left voicemail', 'Spoke with client', 'Appointment scheduled', 'Follow-up needed', 'Not interested', 'Wrong number'];
    const caseOptions = activeCases.map(cs => `<option value="${cs.caseId}">${CrmApp.escapeHtml(cs.productName || cs.title || ('Case #' + cs.caseId))}</option>`).join('');
    const today = new Date().toISOString().slice(0, 10);
    const dialog = CrmApp.openModal({
      title: 'Log Call', wide: true,
      bodyHtml: `
        <form id="call-log-form">
          <div class="form-grid">
            <div class="form-field"><label>Direction</label>
              <select class="input" name="direction"><option value="outbound">Outbound</option><option value="inbound">Inbound</option></select>
            </div>
            <div class="form-field"><label>Date</label><input class="input" name="date" type="date" value="${today}" required></div>
            <div class="form-field"><label>Start time</label><input class="input" name="startTime" type="time"></div>
            <div class="form-field"><label>Duration (minutes)</label><input class="input" name="durationMinutes" type="number" min="0"></div>
            <div class="form-field"><label>Outcome</label>
              <select class="input" name="outcome" required>${CALL_OUTCOMES.map(o => `<option>${o}</option>`).join('')}</select>
            </div>
            ${caseOptions ? `<div class="form-field"><label>Related case (optional)</label><select class="input" name="caseId"><option value="">None</option>${caseOptions}</select></div>` : ''}
            <div class="form-field full"><label>Summary</label><input class="input" name="summary" placeholder="Short summary"></div>
            <div class="form-field full"><label>Detailed notes</label><textarea class="input" name="detailedNotes"></textarea></div>
            <div class="form-field"><label>Next follow-up date</label><input class="input" name="nextActionDueDate" type="date"></div>
            <div class="form-field"><label>Next follow-up time</label><input class="input" name="nextActionDueTime" type="time"></div>
            <div class="form-field full"><label>Follow-up task</label><input class="input" name="nextAction" placeholder="What needs to happen next?"></div>
          </div>
          <div class="text-faint" style="margin-top:8px;">Logged by Loretta Stewart. No audio recording or transcription is created.</div>
          <div class="form-error" id="call-log-error"></div>
          <div class="crmapp-modal-actions">
            <button type="button" class="btn" id="call-log-cancel">Cancel</button>
            <button type="submit" class="btn primary">Save Call Log</button>
          </div>
        </form>
      `,
    });
    dialog.querySelector('#call-log-cancel').addEventListener('click', () => dialog.close());
    dialog.querySelector('#call-log-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fields = Object.fromEntries(new FormData(e.target).entries());
      fields.contactId = Number(contactId);
      if (fields.caseId) fields.caseId = Number(fields.caseId);
      try {
        const result = await CrmApp.postJSON('/api/app/calls', 'POST', fields);
        CrmApp.toast(result.followUpTask ? 'Call logged and follow-up task created.' : 'Call logged.');
        dialog.close();
        reloadPage();
      } catch (err) {
        dialog.querySelector('#call-log-error').textContent = err.message;
      }
    });
  }

  document.getElementById('action-call').addEventListener('click', callPreviewModal);
  document.getElementById('action-log-call').addEventListener('click', callLogModal);
  document.getElementById('action-text').addEventListener('click', () => composeDraftModal('text'));
  document.getElementById('action-email').addEventListener('click', () => composeDraftModal('email'));
  document.getElementById('action-activity').addEventListener('click', addActivityModal);
  document.getElementById('action-edit-client').addEventListener('click', editClientModal);
  document.getElementById('action-company-change').addEventListener('click', requestCompanyChangeModal);
  document.getElementById('action-archive-client').addEventListener('click', toggleArchiveClient);

  // Retirement & Annuity Planning tab: each card saves independently
  // (mirrors the old standalone CRM's per-section Save Changes pattern) by
  // PATCHing the SAME /api/app/clients/:id endpoint Edit Client uses --
  // clientService.js's applyContactFields accepts these fields the same
  // COALESCE way, so an unrelated save (e.g. from Edit Client) never
  // touches these, and saving here never touches anything Edit Client owns.
  // Same toast-then-reload pattern as editClientModal/reconnectionModal/
  // policyFormModal elsewhere on this page.
  function wirePlanningForm(formId, errorId, boolFieldNames) {
    const form = document.getElementById(formId);
    if (!form) return;
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fields = Object.fromEntries(new FormData(e.target).entries());
      for (const name of boolFieldNames) {
        fields[name] = form.querySelector(`[name="${name}"]`).checked;
      }
      const errorEl = document.getElementById(errorId);
      errorEl.textContent = '';
      try {
        await CrmApp.postJSON(`/api/app/clients/${contactId}`, 'PATCH', fields);
        CrmApp.toast('Saved.');
        reloadPage();
      } catch (err) {
        errorEl.textContent = err.message;
      }
    });
  }
  wirePlanningForm('retirement-planning-form', 'retirement-planning-error', ['hasCurrentAdvisor', 'interestedInRothConversion']);
  wirePlanningForm('annuity-planning-form', 'annuity-planning-error', ['incomeRider']);

  function addActivityModal() {
    const ACTIVITY_TYPES = [
      ['note', 'Note'], ['call', 'Phone call'], ['text', 'Text message'], ['email', 'Email'],
      ['appointment', 'Appointment'], ['follow_up', 'Follow-up'], ['document_received', 'Document received'],
      ['policy_update', 'Policy update'], ['general', 'General activity'],
    ];
    const caseOptions = activeCases.map(cs => `<option value="${cs.caseId}">${CrmApp.escapeHtml(cs.productName || cs.title || ('Case #' + cs.caseId))}</option>`).join('');
    const dialog = CrmApp.openModal({
      title: 'Add Activity', wide: true,
      bodyHtml: `
        <form id="activity-form">
          <div class="form-grid">
            <div class="form-field"><label>Type</label>
              <select class="input" name="activityType">${ACTIVITY_TYPES.map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}</select>
            </div>
            <div class="form-field"><label>Date &amp; time</label><input class="input" name="activityAt" type="datetime-local"></div>
            ${caseOptions ? `<div class="form-field full"><label>Related case</label><select class="input" name="caseId"><option value="">None</option>${caseOptions}</select></div>` : ''}
            <div class="form-field full"><label>Summary</label><input class="input" name="summary" placeholder="Short summary"></div>
            <div class="form-field full"><label>Detailed notes</label><textarea class="input" name="details"></textarea></div>
            <div class="form-field"><label>Next action</label><input class="input" name="nextAction"></div>
            <div class="form-field"><label>Due date</label><input class="input" name="nextActionDueDate" type="date"></div>
          </div>
          <div class="text-faint" style="margin-top:8px;">Recorded by Loretta Stewart</div>
          <div class="form-error" id="activity-error"></div>
          <div class="crmapp-modal-actions">
            <button type="button" class="btn" id="activity-cancel">Cancel</button>
            <button type="submit" class="btn primary">Save Activity</button>
          </div>
        </form>
      `,
    });
    dialog.querySelector('#activity-cancel').addEventListener('click', () => dialog.close());
    dialog.querySelector('#activity-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fields = Object.fromEntries(new FormData(e.target).entries());
      fields.contactId = Number(contactId);
      if (fields.caseId) fields.caseId = Number(fields.caseId);
      if (!fields.activityAt) delete fields.activityAt;
      try {
        await CrmApp.postJSON('/api/app/activities', 'POST', fields);
        CrmApp.toast('Activity added.');
        dialog.close();
        reloadPage();
      } catch (err) {
        dialog.querySelector('#activity-error').textContent = err.message;
      }
    });
  }
}
render();
</script>
</body>
</html>
