<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clients — Prosperity CRM</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app-root"></div>
<script src="../config.js"></script>
<script src="shell.js"></script>
<script>
async function render() {
  CrmApp.mount({ active: 'clients', title: 'Clients', subtitle: 'Search, filter, and open any client record' });
  const content = document.getElementById('page-content');

  let state = { search: '', status: 'active', sort: 'name', page: 1, pageSize: 25 };

  content.innerHTML = `
    <div id="verification-needed-banner"></div>
    <div class="card" style="margin-bottom:16px;">
      <div class="card-header">
        <h2>Existing Client Outreach</h2>
        <span class="card-header-sub" id="outreach-selected-count">0 selected</span>
      </div>
      <div class="card-body">
        <div class="search-row">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 4a6 6 0 1 0 3.8 10.6l5.3 5.3 1.4-1.4-5.3-5.3A6 6 0 0 0 10 4Zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z"/></svg>
            <input class="input" id="outreach-search" type="text" placeholder="Search Existing Clients">
          </div>
          <button class="btn primary" id="outreach-send-btn" disabled>Send Message</button>
        </div>
        <div class="text-faint" style="margin-top:8px;">Manually select Prosperity Existing Clients to send the Existing Client Reconnection email and/or initial text.</div>
        <div style="margin-top:12px; max-height:280px; overflow-y:auto; border:1px solid var(--border); border-radius:var(--radius-sm);">
          <table class="data-table" style="margin:0;">
            <thead><tr>
              <th style="width:36px;"><input type="checkbox" id="outreach-select-all"></th>
              <th>Client</th><th>Email</th><th>Phone</th><th>SMS Eligibility</th>
            </tr></thead>
            <tbody id="outreach-rows"></tbody>
          </table>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-body">
        <div class="search-row">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 4a6 6 0 1 0 3.8 10.6l5.3 5.3 1.4-1.4-5.3-5.3A6 6 0 0 0 10 4Zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z"/></svg>
            <input class="input" id="client-search" type="text" placeholder="Search by name, phone, email, or product">
          </div>
          <select class="filter-select" id="status-filter">
            <option value="active">Active clients</option>
            <option value="archived">Archived clients</option>
            <option value="all">All clients</option>
          </select>
          <select class="filter-select" id="sort-select">
            <option value="name">Sort: Name</option>
            <option value="nextAction">Sort: Next action due date</option>
            <option value="lastActivity">Sort: Most recent activity</option>
          </select>
          <a class="btn" href="import.html">Import CSV</a>
          <button class="btn primary" id="add-client-btn">Add Client</button>
        </div>
      </div>
      <div class="card-body no-pad">
        <div class="table-scroll">
          <table class="data-table desktop-only">
            <thead><tr>
              <th>Client</th><th>Company</th><th>Product</th><th>Status</th>
              <th>Next Action</th><th>Due</th><th>Last Activity</th><th></th>
            </tr></thead>
            <tbody id="client-rows"></tbody>
          </table>
        </div>
        <div class="mobile-list" id="mobile-client-list"></div>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  `;

  const searchInput = document.getElementById('client-search');
  const statusSelect = document.getElementById('status-filter');
  const sortSelect = document.getElementById('sort-select');
  let searchTimer;
  searchInput.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { state.search = searchInput.value; state.page = 1; load(); }, 200);
  });
  statusSelect.addEventListener('change', () => { state.status = statusSelect.value; state.page = 1; load(); });
  sortSelect.addEventListener('change', () => { state.sort = sortSelect.value; state.page = 1; load(); });
  document.addEventListener('crmapp:companychange', () => { state.page = 1; load(); });

  function primaryCase(cases) {
    return cases.find(c => c.caseStatus !== 'Archived') || cases[0] || null;
  }

  function clientRowHtml(c) {
    const main = primaryCase(c.cases);
    const badges = c.brandIds.map(b => CrmApp.companyBadge(b)).join(' ');
    const nextAction = main && main.nextAction ? (main.nextAction.notes || main.nextAction.taskType) : '—';
    const due = main && main.dueDate ? CrmApp.friendlyDate(main.dueDate) : '—';
    const overdue = c.nearestDueOverdue;
    return `<tr class="clickable" data-id="${c.contactId}">
      <td><strong>${CrmApp.escapeHtml(c.contactName)}</strong>${c.verificationNeeded ? '<div class="pill overdue" style="margin-top:4px; display:inline-block;">Verification Needed</div>' : ''}${c.activeCaseCount > 1 ? `<div class="text-faint">${c.activeCaseCount} active cases</div>` : ''}</td>
      <td>${badges}</td>
      <td>${main ? CrmApp.escapeHtml(main.productName || '—') : '—'}</td>
      <td>${main ? `<span class="pill status-${(main.caseStatus || '').toLowerCase()}">${CrmApp.escapeHtml(main.caseStatus)}</span>` : '—'}</td>
      <td>${CrmApp.escapeHtml(nextAction)}</td>
      <td class="${overdue ? 'text-danger' : ''}">${overdue ? 'Overdue · ' : ''}${due}</td>
      <td>${main ? CrmApp.friendlyDate(main.lastActivity) : '—'}</td>
      <td><button class="btn small" data-view="${c.contactId}">View Client</button></td>
    </tr>`;
  }

  function mobileRowHtml(c) {
    const badges = c.brandIds.map(b => CrmApp.companyBadge(b)).join(' ');
    const main = primaryCase(c.cases);
    return `<div class="mobile-client-row" data-id="${c.contactId}">
      <div class="mobile-avatar">${CrmApp.initials(c.contactName)}</div>
      <div style="flex:1; min-width:0;">
        <div class="mobile-client-name">${CrmApp.escapeHtml(c.contactName)}</div>
        ${c.verificationNeeded ? '<div class="pill overdue" style="margin:2px 0; display:inline-block;">Verification Needed</div>' : ''}
        <div class="mobile-client-meta">${badges}${c.activeCaseCount > 1 ? `<span class="text-faint">${c.activeCaseCount} cases</span>` : ''}</div>
      </div>
      <div class="text-faint" style="text-align:right;">${main ? CrmApp.friendlyDate(main.dueDate) : ''}</div>
    </div>`;
  }

  async function load() {
    const company = CrmApp.getCompany();
    const params = new URLSearchParams({
      company, status: state.status, search: state.search, sort: state.sort,
      page: state.page, pageSize: state.pageSize,
    });
    let data;
    try {
      data = await CrmApp.fetchJSON('/api/app/clients?' + params.toString());
    } catch (e) {
      document.getElementById('client-rows').innerHTML = `<tr><td colspan="8"><div class="empty-state">Could not load clients: ${CrmApp.escapeHtml(e.message)}</div></td></tr>`;
      return;
    }

    const bannerEl = document.getElementById('verification-needed-banner');
    const flagged = data.verificationNeeded || [];
    bannerEl.innerHTML = flagged.length ? `
      <div class="card" style="margin-bottom:16px; border-color: var(--danger); background: var(--danger-tint);">
        <div class="card-body">
          <div style="font-weight:700; color: var(--danger); letter-spacing:.02em;">${flagged.length} VERIFICATION NEEDED</div>
          <div class="text-faint" style="margin-top:4px;">These contacts were created from a booking that only partly matched an existing record. Open one to compare and resolve.</div>
          <div style="margin-top:10px; display:flex; flex-direction:column; gap:6px;">
            ${flagged.map(f => `
              <a href="client.html?id=${f.contactId}" style="display:flex; justify-content:space-between; gap:10px; padding:8px 10px; background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-sm); text-decoration:none; color:inherit;">
                <strong>${CrmApp.escapeHtml(f.contactName)}</strong>
                <span class="text-faint">${CrmApp.escapeHtml(f.reason)}</span>
              </a>
            `).join('')}
          </div>
        </div>
      </div>
    ` : '';

    const rowsEl = document.getElementById('client-rows');
    const mobileEl = document.getElementById('mobile-client-list');
    if (!data.contacts.length) {
      rowsEl.innerHTML = `<tr><td colspan="8"><div class="empty-state">No clients found${state.search ? ' for “' + CrmApp.escapeHtml(state.search) + '”' : ''}.</div></td></tr>`;
      mobileEl.innerHTML = `<div class="empty-state">No clients found.</div>`;
    } else {
      rowsEl.innerHTML = data.contacts.map(clientRowHtml).join('');
      mobileEl.innerHTML = data.contacts.map(mobileRowHtml).join('');
    }

    document.querySelectorAll('#client-rows tr[data-id], #mobile-client-list [data-id]').forEach(el => {
      el.addEventListener('click', (e) => {
        if (e.target.closest('button')) return;
        location.href = `client.html?id=${el.dataset.id}`;
      });
    });
    document.querySelectorAll('button[data-view]').forEach(btn => {
      btn.addEventListener('click', (e) => { e.stopPropagation(); location.href = `client.html?id=${btn.dataset.view}`; });
    });

    const p = data.pagination;
    const pagEl = document.getElementById('pagination');
    if (!p.totalContacts) { pagEl.innerHTML = ''; }
    else {
      pagEl.innerHTML = `
        <span>${p.rangeStart}–${p.rangeEnd} of ${p.totalContacts} clients</span>
        <span>
          <button class="btn small" id="prev-page" ${p.page <= 1 ? 'disabled' : ''}>Previous</button>
          <button class="btn small" id="next-page" ${p.page >= p.totalPages ? 'disabled' : ''}>Next</button>
        </span>`;
      const prev = document.getElementById('prev-page'), next = document.getElementById('next-page');
      prev && prev.addEventListener('click', () => { state.page = Math.max(1, p.page - 1); load(); });
      next && next.addEventListener('click', () => { state.page = Math.min(p.totalPages, p.page + 1); load(); });
    }
  }

  function addClientModal() {
    let selectedCompany = null; // never preselected
    const dialog = CrmApp.openModal({
      title: 'Add Client',
      bodyHtml: `
        <div class="form-field full">
          <label>Permanent company <span class="hint">(required — cannot be changed casually after saving)</span></label>
          <div class="company-choice-row" id="add-client-company">
            <button type="button" class="company-choice-btn" data-company="insurance-lady">Insurance Lady</button>
            <button type="button" class="company-choice-btn" data-company="prosperity">Prosperity</button>
          </div>
        </div>
        <form id="add-client-form">
          <div class="form-grid" style="margin-top:14px;">
            <div class="form-field"><label>First name</label><input class="input" name="firstName"></div>
            <div class="form-field"><label>Last name</label><input class="input" name="lastName"></div>
            <div class="form-field"><label>Phone</label><input class="input" name="phone" type="tel"></div>
            <div class="form-field"><label>Email</label><input class="input" name="email" type="email"></div>
            <div class="form-field full"><label>Address</label><input class="input" name="address"></div>
            <div class="form-field"><label>City</label><input class="input" name="city"></div>
            <div class="form-field"><label>State</label><input class="input" name="state" maxlength="2" style="text-transform:uppercase;"></div>
            <div class="form-field"><label>ZIP code</label><input class="input" name="zip"></div>
            <div class="form-field"><label>Date of birth <span class="hint">(optional)</span></label><input class="input" name="dateOfBirth" type="date"></div>
            <div class="form-field"><label>Original source</label><input class="input" name="originalSource" placeholder="e.g. Referral, Website"></div>
            <div class="form-field"><label>Relationship</label>
              <select class="input" name="relationshipType" id="add-client-relationship">
                <option value="">— Select —</option>
                <option value="lead">Lead / Prospect</option>
                <option value="active_client">Active Client</option>
                <option value="former_client">Former Client</option>
                <option value="prior_applicant">Prior Applicant</option>
                <option value="declined_applicant">Declined Applicant</option>
              </select>
            </div>
            <div class="form-field full"><label style="display:flex; align-items:center; gap:8px; font-weight:400;"><input type="checkbox" name="smsConsent" id="add-client-sms-consent" style="width:auto;"> SMS consent on file <span class="hint">(required before this client can be texted from the CRM)</span></label></div>
            <div class="form-field"><label>Consent source <span class="hint">(required if SMS consent is checked)</span></label>
              <select class="input" name="smsConsentSource" id="add-client-consent-source">
                <option value="">— Select —</option>
                <option>Website Form</option>
                <option>Phone – Renee</option>
                <option>Phone – Jennifer</option>
                <option>Existing Client – Prior Documented Consent</option>
                <option>Inbound SMS</option>
                <option>Verbal Consent</option>
                <option>Other</option>
              </select>
            </div>
            <div class="form-field full"><label>Consent notes <span class="hint">(optional)</span></label><textarea class="input" name="smsConsentNotes" id="add-client-consent-notes"></textarea></div>
            <div class="form-field full"><label>General notes</label><textarea class="input" name="generalNotes"></textarea></div>
          </div>
          <div class="form-error" id="add-client-error"></div>
          <div class="crmapp-modal-actions">
            <button type="button" class="btn" id="add-client-cancel">Cancel</button>
            <button type="submit" class="btn primary">Add Client</button>
          </div>
        </form>
      `,
    });
    dialog.querySelector('#add-client-company').addEventListener('click', (e) => {
      const btn = e.target.closest('.company-choice-btn');
      if (!btn) return;
      selectedCompany = btn.dataset.company;
      dialog.querySelectorAll('.company-choice-btn').forEach(b => {
        b.classList.toggle('selected', b === btn);
        b.classList.toggle('il', b === btn && b.dataset.company === 'insurance-lady');
        b.classList.toggle('prosperity', b === btn && b.dataset.company === 'prosperity');
      });
    });
    dialog.querySelector('#add-client-cancel').addEventListener('click', () => dialog.close());
    dialog.querySelector('#add-client-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = dialog.querySelector('#add-client-error');
      errorEl.textContent = '';
      if (!selectedCompany) { errorEl.textContent = 'Choose a permanent company before saving.'; return; }
      const fd = new FormData(e.target);
      const fields = Object.fromEntries(fd.entries());
      fields.brandSlug = selectedCompany;
      // Read the checkbox directly rather than trusting FormData, which
      // omits an unchecked box entirely -- this keeps smsConsent an
      // explicit true/false every time, never ambiguous with "not sent".
      fields.smsConsent = dialog.querySelector('#add-client-sms-consent').checked;
      if (fields.smsConsent && !fields.smsConsentSource) {
        errorEl.textContent = 'Choose how SMS consent was obtained before saving.';
        return;
      }
      try {
        const result = await CrmApp.postJSON('/api/app/clients', 'POST', fields);
        if (result.outcome === 'company_conflict') {
          CrmApp.toast('This person already has a different company on file — staged for Review Required instead of created twice.', { error: true });
          dialog.close();
        } else {
          CrmApp.toast('Client added.');
          dialog.close();
          location.href = `client.html?id=${result.contact.id}`;
        }
      } catch (err) {
        errorEl.textContent = err.message;
      }
    });
  }
  document.getElementById('add-client-btn').addEventListener('click', addClientModal);

  // ── Existing Client Outreach (bulk select, Revenue MVP) ─────────────────
  // Deliberately its OWN simple listing, not the paginated case-driven
  // table above -- a brand-new Existing Client (just added via "Add
  // Client") has no case yet and would never appear there. See
  // crm/lib/existingClientOutreach.js's getExistingClientsForOutreach.
  const selectedOutreachIds = new Set();
  let outreachContacts = [];
  let reconnectionTemplatesCache = null;

  function outreachRowHtml(item) {
    return `<tr>
      <td><input type="checkbox" class="outreach-checkbox" data-id="${item.contactId}" ${selectedOutreachIds.has(item.contactId) ? 'checked' : ''}></td>
      <td>${CrmApp.escapeHtml(item.contactName)}</td>
      <td>${CrmApp.escapeHtml(item.email || '—')}</td>
      <td>${CrmApp.escapeHtml(item.phone || '—')}</td>
      <td>${item.smsEligible ? '<span class="pill status-open">SMS Eligible</span>' : `<span class="pill status-blocked">${CrmApp.escapeHtml(item.smsBlockedReason || 'Not eligible')}</span>`}</td>
    </tr>`;
  }

  function updateOutreachSelectedCount() {
    document.getElementById('outreach-selected-count').textContent = `${selectedOutreachIds.size} selected`;
    document.getElementById('outreach-send-btn').disabled = selectedOutreachIds.size === 0;
  }

  async function loadOutreachContacts(search) {
    let data;
    try { data = await CrmApp.fetchJSON('/api/app/existing-client-outreach/contacts?' + new URLSearchParams({ search: search || '' })); }
    catch (e) {
      document.getElementById('outreach-rows').innerHTML = `<tr><td colspan="5"><div class="empty-state">Could not load Existing Clients: ${CrmApp.escapeHtml(e.message)}</div></td></tr>`;
      return;
    }
    outreachContacts = data.items;
    const rowsEl = document.getElementById('outreach-rows');
    rowsEl.innerHTML = outreachContacts.length
      ? outreachContacts.map(outreachRowHtml).join('')
      : '<tr><td colspan="5"><div class="empty-state">No Existing Clients found.</div></td></tr>';
    rowsEl.querySelectorAll('.outreach-checkbox').forEach(cb => {
      cb.addEventListener('change', () => {
        const id = Number(cb.dataset.id);
        if (cb.checked) selectedOutreachIds.add(id); else selectedOutreachIds.delete(id);
        updateOutreachSelectedCount();
      });
    });
    updateOutreachSelectedCount();
  }

  document.getElementById('outreach-select-all').addEventListener('change', (e) => {
    outreachContacts.forEach(item => {
      if (e.target.checked) selectedOutreachIds.add(item.contactId); else selectedOutreachIds.delete(item.contactId);
    });
    document.querySelectorAll('.outreach-checkbox').forEach(cb => { cb.checked = e.target.checked; });
    updateOutreachSelectedCount();
  });

  let outreachSearchTimer;
  document.getElementById('outreach-search').addEventListener('input', (e) => {
    clearTimeout(outreachSearchTimer);
    outreachSearchTimer = setTimeout(() => loadOutreachContacts(e.target.value), 200);
  });

  function bulkSendModal() {
    const count = selectedOutreachIds.size;
    let channel = 'sms';

    const dialog = CrmApp.openModal({
      title: 'Send Message to Selected Existing Clients',
      wide: true,
      bodyHtml: `
        <div style="display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;">
          <button type="button" class="btn small primary" id="bulk-channel-sms">SMS — Existing Client Reconnection / SMS Permission</button>
          <button type="button" class="btn small" id="bulk-channel-email">Email — Existing Client Reconnection / Policy Review</button>
        </div>
        <div class="text-faint" style="margin-bottom:8px;">${count} recipient${count === 1 ? '' : 's'} selected. {{first_name}} is filled in individually for each recipient at send time.</div>
        <div id="bulk-channel-body"></div>
        <div class="form-error" id="bulk-send-error"></div>
        <div id="bulk-send-results" style="margin-top:12px; max-height:220px; overflow-y:auto;"></div>
        <div class="crmapp-modal-actions">
          <button type="button" class="btn" id="bulk-cancel">Cancel</button>
          <button type="button" class="btn primary" id="bulk-send">Send to Selected</button>
        </div>
      `,
    });

    function renderChannelBody() {
      if (!reconnectionTemplatesCache) { dialog.querySelector('#bulk-channel-body').innerHTML = '<div class="empty-state">Could not load the message template.</div>'; return; }
      const isSms = channel === 'sms';
      const prefilled = (isSms ? reconnectionTemplatesCache.sms.body : reconnectionTemplatesCache.email.body)
        .replace(/\{\{office_phone\}\}/g, reconnectionTemplatesCache.officePhone);
      dialog.querySelector('#bulk-channel-body').innerHTML = `
        ${isSms ? '' : `<div class="form-field full"><label>Subject</label><input class="input" id="bulk-subject" value="${CrmApp.escapeHtml(reconnectionTemplatesCache.email.subject)}"></div>`}
        <div class="form-field full"><label>Message</label><textarea class="input" id="bulk-body" rows="12">${CrmApp.escapeHtml(prefilled)}</textarea></div>
      `;
      dialog.querySelector('#bulk-channel-sms').classList.toggle('primary', isSms);
      dialog.querySelector('#bulk-channel-email').classList.toggle('primary', !isSms);
    }
    renderChannelBody();
    dialog.querySelector('#bulk-channel-sms').addEventListener('click', () => { channel = 'sms'; renderChannelBody(); });
    dialog.querySelector('#bulk-channel-email').addEventListener('click', () => { channel = 'email'; renderChannelBody(); });
    dialog.querySelector('#bulk-cancel').addEventListener('click', () => dialog.close());

    dialog.querySelector('#bulk-send').addEventListener('click', async () => {
      const errorEl = dialog.querySelector('#bulk-send-error');
      errorEl.textContent = '';
      const isSms = channel === 'sms';
      const bodyText = dialog.querySelector('#bulk-body').value;
      const subject = isSms ? undefined : dialog.querySelector('#bulk-subject').value;
      const ok = await CrmApp.confirmAction(`Send this ${isSms ? 'text' : 'email'} to ${count} selected Existing Client${count === 1 ? '' : 's'}?`, { confirmLabel: 'Send to Selected' });
      if (!ok) return;
      try {
        const result = await CrmApp.postJSON('/api/app/existing-client-outreach/bulk', 'POST', {
          contactIds: [...selectedOutreachIds], channel, message: bodyText, subject, body: bodyText,
        });
        const resultsEl = dialog.querySelector('#bulk-send-results');
        resultsEl.innerHTML = result.results.map(r => `<div style="display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px solid var(--border);">
          <span>${CrmApp.escapeHtml(r.contactName)}</span>
          <span class="pill status-${r.outcome === 'sent' ? 'open' : r.outcome === 'failed' ? 'failed' : 'blocked'}">${r.outcome === 'sent' ? 'SENT' : r.outcome === 'failed' ? 'FAILED' : 'BLOCKED'}${r.reason ? ' — ' + CrmApp.escapeHtml(r.reason) : ''}</span>
        </div>`).join('');
        CrmApp.toast(`${result.results.filter(r => r.outcome === 'sent').length} of ${result.results.length} sent.`);
        loadOutreachContacts(document.getElementById('outreach-search').value);
      } catch (err) {
        errorEl.textContent = err.message;
      }
    });
  }

  document.getElementById('outreach-send-btn').addEventListener('click', async () => {
    if (!reconnectionTemplatesCache) {
      try { reconnectionTemplatesCache = await CrmApp.fetchJSON('/api/app/existing-client-outreach/templates'); } catch { reconnectionTemplatesCache = null; }
    }
    bulkSendModal();
  });

  loadOutreachContacts('');

  load();
}
render();
</script>
</body>
</html>
