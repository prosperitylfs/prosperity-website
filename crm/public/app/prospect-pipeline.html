<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prospect Pipeline — Prosperity CRM</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app-root"></div>
<script src="../config.js"></script>
<script src="shell.js"></script>
<script>
// The PERMANENT home for every currently-unresolved prospect, regardless of
// how long ago they entered the CRM -- unlike New Prospects (a 7-day
// recent-arrivals/attention indicator, public/app/new-prospects.html) and
// unlike Clients (public/app/clients.html, which requires a case to exist).
// Reads GET /api/app/prospect-pipeline, backed by
// crm/lib/dashboardQueries.js's getProspectPipelineQueue() -- which shares
// its qualification predicate with getNewProspectsQueue via the same
// internal queryProspects() helper, so "what counts as a prospect" can
// never drift between the two views. No duplicate record: this reads the
// exact same contacts rows New Prospects does, just without the 7-day
// restriction. A contact leaves this list automatically, on its very next
// load, the moment relationship_type is set to anything other than
// NULL/'lead' (active_client, former_client, prior_applicant,
// declined_applicant, ...).
async function render() {
  CrmApp.mount({ active: 'prospect-pipeline', title: 'Prospect Pipeline', subtitle: 'Every unresolved prospect, regardless of age, until they become a client or another disposition is set' });
  const content = document.getElementById('page-content');
  content.innerHTML = '<div class="empty-state">Loading…</div>';

  async function load() {
    const company = CrmApp.getCompany();
    let data;
    try {
      data = await CrmApp.fetchJSON('/api/app/prospect-pipeline?company=' + encodeURIComponent(company));
    } catch (e) {
      content.innerHTML = `<div class="empty-state">Could not load the prospect pipeline: ${CrmApp.escapeHtml(e.message)}</div>`;
      return;
    }
    renderList(data.prospects);
  }

  function renderList(prospects) {
    content.innerHTML = `<div class="card">
      <div class="card-header"><h2>Prospect Pipeline</h2><span class="card-header-sub">${prospects.length} unresolved</span></div>
      <div class="card-body no-pad table-scroll">
        ${prospects.length ? `<table class="data-table"><thead><tr>
          <th>Name</th><th>Company</th><th>Phone</th><th>Email</th><th>Date Entered</th><th>Lead Status</th><th>Relationship</th><th></th>
        </tr></thead>
        <tbody>${prospects.map(p => `<tr>
          <td>${CrmApp.escapeHtml(p.name)}</td>
          <td>${CrmApp.companyBadge(p.brandId, p.brandShortName)}</td>
          <td>${CrmApp.escapeHtml(p.phone || '—')}</td>
          <td>${CrmApp.escapeHtml(p.email || '—')}</td>
          <td>${CrmApp.friendlyDateTime(p.createdAt)}</td>
          <td>${CrmApp.escapeHtml(p.leadStatus || '—')}</td>
          <td>${CrmApp.escapeHtml(p.relationshipType || '—')}</td>
          <td><a class="btn small" href="client.html?id=${p.contactId}">Open</a></td>
        </tr>`).join('')}</tbody></table>` : '<div class="empty-state">No unresolved prospects right now.</div>'}
      </div>
    </div>`;
  }

  load();
  document.addEventListener('crmapp:companychange', load);
}
render();
</script>
</body>
</html>
