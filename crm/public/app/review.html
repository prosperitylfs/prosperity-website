<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review Required — Prosperity CRM</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app-root"></div>
<script src="../config.js"></script>
<script src="shell.js"></script>
<script>
const PRODUCTS_BY_BRAND = {
  'insurance-lady': ['Online life-insurance application', 'Cash-building life insurance', 'Whole life/final expense', 'Cash cancer insurance', 'Annuities and safe-money solutions', 'Follow-up/service'],
  prosperity: ['Life insurance', 'Annuities', 'Rollovers and safe-money solutions', 'Follow-up/service'],
};

async function render() {
  CrmApp.mount({ active: 'review', title: 'Review Required', subtitle: 'Nothing here was decided automatically', showCompanyFilter: false });
  const content = document.getElementById('page-content');
  content.innerHTML = '<div class="empty-state">Loading…</div>';

  const params = new URLSearchParams(location.search);
  let activeQueue = params.get('type') || 'brand';

  let prosperityClients = [];

  async function load() {
    let data;
    try { data = await CrmApp.fetchJSON('/api/app/review'); }
    catch (e) { content.innerHTML = `<div class="empty-state">Could not load review queues: ${CrmApp.escapeHtml(e.message)}</div>`; return; }
    try {
      const clientsResp = await CrmApp.fetchJSON('/api/app/clients?company=prosperity&status=active&pageSize=200');
      prosperityClients = clientsResp.contacts || [];
    } catch { prosperityClients = []; }
    renderShell(data);
  }

  function evidenceBlock(evidence) {
    if (!evidence || !evidence.length) return '';
    return `<div style="margin-top:8px; font-size:13px;">${evidence.map(e => `<div>${CrmApp.escapeHtml(e)}</div>`).join('')}</div>`;
  }
  function techDetails(details) {
    if (!details) return '';
    return `<details class="tech-details"><summary>Technical details</summary><pre>${CrmApp.escapeHtml(JSON.stringify(details, null, 2))}</pre></details>`;
  }

  function brandItemHtml(item) {
    return `<div class="card" style="margin-bottom:12px;"><div class="card-body">
      <div style="display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;">
        <strong>${CrmApp.escapeHtml(item.identifier)}</strong>
        <span class="text-faint">${CrmApp.escapeHtml(item.channelLabel)} · ${CrmApp.friendlyDate(item.receivedDate)}</span>
      </div>
      <div style="margin-top:6px;">${CrmApp.escapeHtml(item.reason)}</div>
      ${evidenceBlock(item.evidence)}
      <div style="margin-top:12px; display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn small" data-brand-resolve="${item.intakeId}" data-decision="insurance-lady">Assign to Insurance Lady</button>
        <button class="btn small" data-brand-resolve="${item.intakeId}" data-decision="prosperity">Assign to Prosperity</button>
        <button class="btn small ghost" data-brand-resolve="${item.intakeId}" data-decision="test_archive">Archive as test</button>
      </div>
    </div></div>`;
  }

  function caseItemHtml(item) {
    const candidateOptions = (item.candidateCases || []).map(c => `<option value="${c.caseId}">${CrmApp.escapeHtml(c.label)}</option>`).join('');
    const brandForProducts = item.brandId || 'prosperity';
    return `<div class="card" style="margin-bottom:12px;"><div class="card-body">
      <div style="display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;">
        <strong>${CrmApp.escapeHtml(item.contactName || 'Unnamed contact')}</strong>
        ${item.brandId ? CrmApp.companyBadge(item.brandId, item.brandShortName) : ''}
      </div>
      <div style="margin-top:6px;">${CrmApp.escapeHtml(item.reason)}</div>
      ${techDetails(item.technicalDetails)}
      ${candidateOptions ? `
        <div class="form-field" style="margin-top:12px;">
          <label>Attach to which case?</label>
          <select class="input" data-attach-select="${item.intakeId}">
            <option value="">Choose a case…</option>
            ${candidateOptions}
          </select>
        </div>
        <button class="btn small" style="margin-top:8px;" data-case-resolve="${item.intakeId}" data-action="attach_existing_case">Attach to Selected Case</button>
      ` : ''}
      ${!item.productName ? `
        <div class="form-field" style="margin-top:12px;">
          <label>Product / service for a new case</label>
          <select class="input" data-product-select="${item.intakeId}">
            ${PRODUCTS_BY_BRAND[brandForProducts].map(p => `<option>${p}</option>`).join('')}
          </select>
        </div>` : ''}
      <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn small" data-case-resolve="${item.intakeId}" data-action="create_new_case">Create New Case</button>
        <button class="btn small ghost" data-case-resolve="${item.intakeId}" data-action="test_archive">Archive as test</button>
      </div>
    </div></div>`;
  }

  function conflictItemHtml(item) {
    return `<div class="card" style="margin-bottom:12px;"><div class="card-body">
      <div style="display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;">
        <strong>${CrmApp.escapeHtml(item.contactName || 'Unnamed contact')}</strong>
        <span class="text-faint">${item.kind === 'company_change' ? 'Manually requested' : CrmApp.escapeHtml(item.channelLabel)} · ${CrmApp.friendlyDate(item.receivedDate)}</span>
      </div>
      <div style="margin-top:6px;">${CrmApp.escapeHtml(item.reason)}</div>
      <div class="conflict-compare" style="margin-top:12px;">
        <div class="company-box"><div class="label">Existing Company</div>${CrmApp.companyBadge(item.existingBrandId, item.existingBrandShortName)}</div>
        <div class="arrow">vs</div>
        <div class="company-box"><div class="label">${item.kind === 'company_change' ? 'Requested Company' : 'Incoming Source Company'}</div>${CrmApp.companyBadge(item.incomingBrandId, item.incomingBrandShortName)}</div>
      </div>
      ${evidenceBlock(item.evidence)}
      ${techDetails(item.technicalDetails)}
      <div style="margin-top:12px; display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn small" data-company-resolve="${item.intakeId}" data-action="keep_existing">Keep Existing Company</button>
        <button class="btn small ghost" data-company-resolve="${item.intakeId}" data-action="test_archive">Archive as test</button>
      </div>
      <div class="text-faint" style="margin-top:8px;">A transfer action is not implemented in this checkpoint — the only resolutions are keeping the existing company or archiving as test.</div>
    </div></div>`;
  }

  function identityBox(label, identity) {
    return `<div class="company-box" style="text-align:left;">
      <div class="label">${CrmApp.escapeHtml(label)}</div>
      <div><strong>${CrmApp.escapeHtml(identity.name || 'Unnamed')}</strong></div>
      <div class="text-faint">${CrmApp.escapeHtml(identity.email || 'No email on file')}</div>
      <div class="text-faint">${CrmApp.escapeHtml(identity.phone || 'No phone on file')}</div>
    </div>`;
  }

  function contactConflictItemHtml(item) {
    return `<div class="card" style="margin-bottom:12px;${item.nameMismatch ? ' border-color: var(--danger);' : ''}"><div class="card-body">
      <div style="display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;">
        <strong>Possible Duplicate Contact</strong>
        <span class="text-faint">${CrmApp.escapeHtml(item.channelLabel)} · ${CrmApp.friendlyDate(item.receivedDate)}</span>
      </div>
      ${item.nameMismatch ? `<div class="pill overdue" style="margin-top:8px; display:inline-block;">NAME MISMATCH — VERIFICATION NEEDED</div>` : ''}
      <div style="margin-top:6px;">${CrmApp.escapeHtml(item.reason)}</div>
      <div class="conflict-compare" style="margin-top:12px;">
        ${identityBox('Existing Contact', item.existing)}
        <div class="arrow">vs</div>
        ${identityBox('Incoming Booking', item.incoming)}
      </div>
      <div style="margin-top:12px; display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn small primary" data-contact-resolve="${item.intakeId}" data-action="same_person">Same Person</button>
        <button class="btn small" data-contact-resolve="${item.intakeId}" data-action="confirm_different">Different Person</button>
        <button class="btn small ghost" data-contact-resolve="${item.intakeId}" data-action="test_archive">Archive as test</button>
      </div>
      <div class="text-faint" style="margin-top:8px;">A new contact was already created from the incoming booking's own information — nothing was merged or overwritten yet. "Same Person" moves its appointment and text history onto the existing contact and archives the duplicate; "Different Person" just clears this warning and leaves both records untouched.</div>
    </div></div>`;
  }

  function unknownSmsItemHtml(item) {
    const clientOptions = prosperityClients.map(c => `<option value="${c.contactId}">${CrmApp.escapeHtml(c.contactName)}</option>`).join('');
    return `<div class="card" style="margin-bottom:12px;"><div class="card-body">
      <div style="display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;">
        <strong>${CrmApp.escapeHtml(item.fromNumber || 'Unknown number')}</strong>
        <span class="text-faint">Prosperity 414 number · ${CrmApp.friendlyDate(item.receivedDate)}</span>
      </div>
      <div style="margin-top:6px;">${CrmApp.escapeHtml(item.reason)}</div>
      <div class="sender-preview" style="margin-top:10px;">"${CrmApp.escapeHtml(item.body || '')}"</div>
      <div class="form-field" style="margin-top:12px;">
        <label>Attach to an existing active Prosperity client</label>
        <select class="input" data-unknown-sms-client="${item.intakeId}">
          <option value="">Choose a client…</option>
          ${clientOptions}
        </select>
      </div>
      <div style="margin-top:8px; display:flex; gap:8px;">
        <button class="btn small" data-unknown-sms-resolve="${item.intakeId}" data-action="attach_existing">Attach to Existing Prosperity Client</button>
      </div>
      <div class="form-field full" style="margin-top:14px; border-top:1px solid var(--border); padding-top:12px;">
        <label>Or create a genuinely new Prosperity client</label>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <input class="input" style="flex:1; min-width:120px;" placeholder="First name" data-unknown-sms-firstname="${item.intakeId}">
          <input class="input" style="flex:1; min-width:120px;" placeholder="Last name" data-unknown-sms-lastname="${item.intakeId}">
        </div>
      </div>
      <div style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn small" data-unknown-sms-resolve="${item.intakeId}" data-action="create_new">Create New Prosperity Client</button>
        <button class="btn small ghost" data-archive-review="${item.intakeId}">Archive / Test</button>
      </div>
    </div></div>`;
  }

  function archiveItemHtml(item) {
    return `<div class="card" style="margin-bottom:12px;"><div class="card-body">
      <div style="display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;">
        <span>${CrmApp.escapeHtml(item.reason)}</span>
        <span class="text-faint">${CrmApp.friendlyDate(item.resolved_at)}</span>
      </div>
      <div class="text-faint" style="margin-top:6px;">Resolved by ${CrmApp.escapeHtml(item.resolved_by || 'unknown')}</div>
    </div></div>`;
  }

  const RENDERERS = { brand: brandItemHtml, case: caseItemHtml, company_conflict: conflictItemHtml, contact_conflict: contactConflictItemHtml, unknown_sms: unknownSmsItemHtml, archive: archiveItemHtml };
  let currentData;

  function renderQueueBody() {
    const QUEUES = [
      { key: 'brand', label: 'Brand Review Required', items: currentData.brandReview },
      { key: 'case', label: 'Case Review Required', items: currentData.caseReview },
      { key: 'company_conflict', label: 'Company-Assignment Conflicts', items: currentData.companyConflicts },
      { key: 'contact_conflict', label: 'Contact Verification Needed', items: currentData.contactConflicts },
      { key: 'unknown_sms', label: 'Unrecognized Text Senders', items: currentData.unknownSmsReview },
      { key: 'archive', label: 'Test / Archive', items: currentData.testArchive },
    ];
    document.getElementById('queue-tabs').innerHTML = QUEUES.map(q => `<button class="tab-btn${q.key === activeQueue ? ' active' : ''}" data-queue="${q.key}">${q.label} <span class="text-faint">(${q.items.length})</span></button>`).join('');
    const queue = QUEUES.find(q => q.key === activeQueue) || QUEUES[0];
    document.getElementById('queue-body').innerHTML = queue.items.length ? queue.items.map(RENDERERS[queue.key]).join('') : '<div class="empty-state">Nothing waiting here.</div>';
    return QUEUES;
  }

  function renderShell(data) {
    currentData = data;
    content.innerHTML = `
      <div class="tabs" id="queue-tabs" style="background:var(--surface); border:1px solid var(--border); border-bottom:none; border-radius:var(--radius) var(--radius) 0 0; padding:0 8px;"></div>
      <div style="border:1px solid var(--border); border-top:none; border-radius:0 0 var(--radius) var(--radius); background:var(--surface); padding:16px;" id="queue-body"></div>
    `;
    renderQueueBody();

    document.getElementById('queue-tabs').addEventListener('click', (e) => {
      const btn = e.target.closest('.tab-btn');
      if (!btn) return;
      activeQueue = btn.dataset.queue;
      renderQueueBody();
    });

    document.getElementById('queue-body').addEventListener('click', async (e) => {
      const brandBtn = e.target.closest('[data-brand-resolve]');
      if (brandBtn) {
        const decision = brandBtn.dataset.decision;
        const label = decision === 'test_archive' ? 'archive this intake as a test' : `assign this person to ${decision === 'insurance-lady' ? 'Insurance Lady' : 'Prosperity'}`;
        const ok = await CrmApp.confirmAction(`Confirm: ${label}?`, { confirmLabel: 'Confirm', danger: decision === 'test_archive' });
        if (!ok) return;
        try {
          await CrmApp.postJSON(`/api/app/review/brand/${brandBtn.dataset.brandResolve}/resolve`, 'POST', { decision });
          CrmApp.toast('Resolved.');
          load();
        } catch (err) { CrmApp.toast(err.message, { error: true }); }
        return;
      }

      const caseBtn = e.target.closest('[data-case-resolve]');
      if (caseBtn) {
        const intakeId = caseBtn.dataset.caseResolve;
        const action = caseBtn.dataset.action;
        const body = { action };
        if (action === 'attach_existing_case') {
          const sel = document.querySelector(`[data-attach-select="${intakeId}"]`);
          if (!sel || !sel.value) { CrmApp.toast('Choose a case to attach to first.', { error: true }); return; }
          body.targetCaseId = Number(sel.value);
        }
        if (action === 'create_new_case') {
          const prodSel = document.querySelector(`[data-product-select="${intakeId}"]`);
          if (prodSel) body.productName = prodSel.value;
        }
        const label = action === 'attach_existing_case' ? 'attach this to the selected case' : action === 'create_new_case' ? 'create a genuinely new case' : 'archive this intake as a test';
        const ok = await CrmApp.confirmAction(`Confirm: ${label}?`, { confirmLabel: 'Confirm', danger: action === 'test_archive' });
        if (!ok) return;
        try {
          await CrmApp.postJSON(`/api/app/review/case/${intakeId}/resolve`, 'POST', body);
          CrmApp.toast('Resolved.');
          load();
        } catch (err) { CrmApp.toast(err.message, { error: true }); }
        return;
      }

      const companyBtn = e.target.closest('[data-company-resolve]');
      if (companyBtn) {
        const action = companyBtn.dataset.action;
        const label = action === 'keep_existing' ? 'keep the existing company (the incoming record stays unlinked)' : 'archive this as a test';
        const ok = await CrmApp.confirmAction(`Confirm: ${label}?`, { confirmLabel: 'Confirm', danger: action === 'test_archive' });
        if (!ok) return;
        try {
          await CrmApp.postJSON(`/api/app/review/company/${companyBtn.dataset.companyResolve}/resolve`, 'POST', { action });
          CrmApp.toast('Resolved.');
          load();
        } catch (err) { CrmApp.toast(err.message, { error: true }); }
        return;
      }

      const contactBtn = e.target.closest('[data-contact-resolve]');
      if (contactBtn) {
        const item = currentData.contactConflicts.find(i => String(i.intakeId) === contactBtn.dataset.contactResolve);
        if (item) {
          const result = await CrmApp.resolveContactConflict(item, contactBtn.dataset.action);
          if (result) load();
        }
        return;
      }

      const unknownSmsBtn = e.target.closest('[data-unknown-sms-resolve]');
      if (unknownSmsBtn) {
        const intakeId = unknownSmsBtn.dataset.unknownSmsResolve;
        const action = unknownSmsBtn.dataset.action;

        if (action === 'attach_existing') {
          const sel = document.querySelector(`[data-unknown-sms-client="${intakeId}"]`);
          if (!sel || !sel.value) { CrmApp.toast('Choose a client to attach this message to first.', { error: true }); return; }
          const clientLabel = sel.options[sel.selectedIndex].textContent;
          const ok = await CrmApp.confirmAction(`Confirm: attach this text message to ${clientLabel}?`, { confirmLabel: 'Attach' });
          if (!ok) return;
          try {
            await CrmApp.postJSON(`/api/app/review/unknown-sms/${intakeId}/resolve`, 'POST', { action: 'attach_existing', contactId: Number(sel.value) });
            CrmApp.toast('Message attached.');
            load();
          } catch (err) { CrmApp.toast(err.message, { error: true }); }
          return;
        }

        if (action === 'create_new') {
          const firstSel = document.querySelector(`[data-unknown-sms-firstname="${intakeId}"]`);
          const lastSel = document.querySelector(`[data-unknown-sms-lastname="${intakeId}"]`);
          const firstName = firstSel ? firstSel.value.trim() : '';
          const lastName = lastSel ? lastSel.value.trim() : '';
          if (!firstName && !lastName) { CrmApp.toast('Enter at least a first or last name for the new client.', { error: true }); return; }
          const ok = await CrmApp.confirmAction(`Confirm: create a brand-new Prosperity client "${[firstName, lastName].filter(Boolean).join(' ')}" and attach this message to them?`, { confirmLabel: 'Create Client' });
          if (!ok) return;
          try {
            const result = await CrmApp.postJSON(`/api/app/review/unknown-sms/${intakeId}/resolve`, 'POST', { action: 'create_new', firstName, lastName });
            if (result.outcome === 'company_conflict') {
              CrmApp.toast('This number already belongs to a client under a different company — resolve that conflict first.', { error: true });
            } else {
              CrmApp.toast('New Prosperity client created and message attached.');
            }
            load();
          } catch (err) { CrmApp.toast(err.message, { error: true }); }
          return;
        }
      }

      const archiveBtn = e.target.closest('[data-archive-review]');
      if (archiveBtn) {
        const ok = await CrmApp.confirmAction('Confirm: archive this review item as a test?', { confirmLabel: 'Archive', danger: true });
        if (!ok) return;
        try {
          await CrmApp.postJSON(`/api/app/review/${archiveBtn.dataset.archiveReview}/archive`, 'POST');
          CrmApp.toast('Archived.');
          load();
        } catch (err) { CrmApp.toast(err.message, { error: true }); }
      }
    });
  }

  load();
}
render();
</script>
</body>
</html>
