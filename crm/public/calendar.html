<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar — Prosperity CRM</title>

  <!-- PWA + icons -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4e2c94">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Prosperity CRM">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-touch-icon-152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="/icons/apple-touch-icon-167.png">
  <meta name="msapplication-TileImage" content="/icons/icon-144.png">
  <meta name="msapplication-TileColor" content="#3a1f70">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Mobile top bar -->
  <header class="mobile-topbar">
    <button class="hamburger-btn" id="hamburger-btn" aria-label="Open menu">☰</button>
    <span class="mobile-topbar-title">Calendar</span>
    <a href="/calls.html" class="mobile-calls-btn" aria-label="Calls &amp; Voicemail">
      📞<span class="nav-badge hidden" id="nav-badge-calls-mobile"></span>
    </a>
  </header>

  <div class="layout">

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark">P</div>
        <div>
          <div class="brand-name">Prosperity</div>
          <div class="brand-sub">CRM</div>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="/" class="nav-link">Contacts</a>
        <a href="/calls.html" class="nav-link">
          Calls
          <span class="nav-badge hidden" id="nav-badge-calls"></span>
        </a>
        <a href="/calendar.html" class="nav-link active">Calendar</a>
        <a href="/settings.html" class="nav-link">Settings</a>
      </nav>
      <div class="sidebar-footer">Prosperity Life &amp; Financial</div>
    </aside>

    <main class="main">

      <div class="page-header">
        <div>
          <h1 class="page-title">Calendar</h1>
          <p class="page-subtitle" id="cal-count">Loading…</p>
        </div>
        <p class="page-subtitle" style="font-size:.75rem;color:var(--text-muted);align-self:flex-end">All times in Central Time</p>
      </div>

      <div class="calls-tabs" id="cal-tabs">
        <button class="calls-tab" data-view="upcoming">Upcoming</button>
        <button class="calls-tab" data-view="past">Past</button>
        <button class="calls-tab active" data-view="">All</button>
      </div>

      <div id="cal-error" class="error-banner hidden"></div>

      <!-- Desktop table -->
      <div class="table-card" id="cal-table-card">
        <table class="contacts-table" id="cal-table">
          <thead>
            <tr>
              <th>Contact</th>
              <th>Phone</th>
              <th class="cal-col-email">Email</th>
              <th>Type</th>
              <th>Date / Time (CT)</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="cal-tbody">
            <tr><td colspan="7" class="loading-row">Loading appointments…</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Mobile cards -->
      <div id="cal-cards" class="cal-cards hidden"></div>

      <!-- Empty state -->
      <div id="cal-empty" class="empty-state hidden">
        <div class="empty-icon">📅</div>
        <p>No appointments found.<br>Add appointments from a contact's detail page.</p>
      </div>

    </main>
  </div>

  <script src="config.js"></script>
  <script src="nav.js"></script>
  <script src="calendar.js"></script>
</body>
</html>
