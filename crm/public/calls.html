<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calls &amp; Voicemail — Prosperity CRM</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4e2c94">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Prosperity CRM">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Mobile top bar -->
  <header class="mobile-topbar">
    <button class="hamburger-btn" id="hamburger-btn" aria-label="Open menu">☰</button>
    <span class="mobile-topbar-title">Calls &amp; Voicemail</span>
    <span style="width:36px"></span>
  </header>

  <div class="layout">

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark">P</div>
        <div>
          <div class="brand-name">Prosperity</div>
          <div class="brand-sub">CRM</div>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="/" class="nav-link">Contacts</a>
        <a href="/calls.html" class="nav-link active">
          Calls
          <span class="nav-badge hidden" id="nav-badge-calls"></span>
        </a>
        <a href="/settings.html" class="nav-link">Settings</a>
      </nav>
      <div class="sidebar-footer">Prosperity Life &amp; Financial</div>
    </aside>

    <main class="main">

      <div class="page-header">
        <div>
          <h1 class="page-title">Calls &amp; Voicemail</h1>
          <p class="page-subtitle" id="calls-count">Loading…</p>
        </div>
      </div>

      <div class="calls-tabs" id="calls-tabs">
        <button class="calls-tab active" data-filter="">All Calls</button>
        <button class="calls-tab" data-filter="inbound">Inbound</button>
        <button class="calls-tab" data-filter="missed">
          Missed
          <span class="tab-badge hidden" id="tab-badge-missed"></span>
        </button>
        <button class="calls-tab" data-filter="voicemail">
          Voicemail
          <span class="tab-badge hidden" id="tab-badge-voicemail"></span>
        </button>
        <button class="calls-tab" data-filter="unknown">Unknown Callers</button>
      </div>

      <div id="calls-error" class="error-banner hidden"></div>

      <div class="calls-list-card" id="calls-container">
        <div class="loading-row">Loading calls…</div>
      </div>

    </main>
  </div>

  <script src="config.js"></script>
  <script src="nav.js"></script>
  <script src="calls-page.js"></script>
</body>
</html>
